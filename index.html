<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Store</title>
    <script src="product.js" defer></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;

        }
        #products-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .product {
            border: 3px solid black;
            padding: 10px;
            text-align: center;
            background-color:oldlace;
            cursor: pointer;
        }
        .product img {
            max-width: 100%;
            height: auto;
        }
        #searchinput {
            padding: 8px;
            width: 200px;
            margin: 10px 0;
            align-items: center;
        }
        #searchbtn, #historybtn ,#viewhistory {
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 5px;
        }
        #btns {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
        }

    </style>
</head>
<body>
    <h1>Product Store</h1>
    <div id="btns">
        <div><input type="text" id="searchinput" placeholder="Search products..." />
            <button id="searchbtn">Search</button>
        </div>  
        <div>
            <button id="historybtn">Search History</button>
            <button id="viewhistory">View History</button>
        </div>
    </div>
    <div id="suggestions"></div>
    <div id="results"></div>
    <section id="products-container"></section>
    
</body>
</html>
