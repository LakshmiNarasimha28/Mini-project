<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Store</title>
    <script src="product.js" defer></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;

        }
        #products-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        #productList {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .product {
            border: 3px solid black;
            padding: 10px;
            text-align: center;
            background-color:oldlace;
            cursor: pointer;
        }
        .product-card {
            border: 3px solid black;
            padding: 10px;
            text-align: center;
            background-color: oldlace;
            cursor: pointer;
            border-radius: 5px;
            transition: transform 0.2s;
        }
        .product-card:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .product-card img {
            max-width: 100%;
            height: 150px;
            object-fit: cover;
        }
        .product img {
            max-width: 100%;
            height: auto;
        }
        #searchinput {
            padding: 8px;
            width: 200px;
            margin: 10px 0;
            align-items: center;
        }
        #searchbtn, #historybtn ,#viewhistory {
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 5px;
        }
        #btns {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
        }
        #paging {
            margin-top: 20px;
            padding: 20px 0;
            text-align: center;
        }
        #paging button {
            font-weight: 500;
            transition: all 0.3s ease;
        }
        #paging button:disabled {
            opacity: 0.6;
        }
        #paging button:not(:disabled):active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <h1>Product Store</h1>
    <div id="btns">
        <div><input type="text" id="searchinput" placeholder="Search products..." />
            <button id="searchbtn">Search</button>
        </div>  
        <div>
            <button id="historybtn">Search History</button>
            <button id="viewhistory">View History</button>
        </div>
    </div>
    <div id="suggestions"></div>
    <div id="results"></div>
    <section id="products-container"></section>

    <div id="paging"></div>
    
</body>
</html>
