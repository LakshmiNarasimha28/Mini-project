<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details</title>
    <script src="productdetails.js" defer></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        
        .header-buttons {
            margin-bottom: 30px;
        }
        
        #backbtn {
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            background-color: #2196F3;
            color: white;
            border: none;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        #backbtn:hover {
            background-color: #0b7dda;
            transform: translateX(-5px);
        }
        
        .product-container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        .product-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            padding: 40px;
        }
        
        .product-images {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .main-image-container {
            width: 100%;
            height: 400px;
            background-color: #f9f9f9;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #thumbnail {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        
        .image-gallery {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
        }
        
        .gallery-img {
            width: 70px;
            height: 70px;
            border-radius: 5px;
            cursor: pointer;
            border: 2px solid #ddd;
            object-fit: cover;
            transition: all 0.3s ease;
        }
        
        .gallery-img:hover {
            border-color: #2196F3;
            transform: scale(1.05);
        }
        
        .gallery-img.active {
            border-color: #2196F3;
            box-shadow: 0 0 10px rgba(33, 150, 243, 0.5);
        }
        
        .product-info {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .product-title {
            font-size: 32px;
            font-weight: bold;
            color: #333;
            line-height: 1.3;
        }
        
        .product-meta {
            display: flex;
            gap: 20px;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }
        
        .rating {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 16px;
        }
        
        .rating-value {
            color: #ff9800;
            font-weight: bold;
        }
        
        .stock-status {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }
        
        .in-stock {
            background-color: #e8f5e9;
            color: #2e7d32;
        }
        
        .out-of-stock {
            background-color: #ffebee;
            color: #c62828;
        }
        
        .product-price {
            font-size: 28px;
            color: #2e7d32;
            font-weight: bold;
        }
        
        .product-description {
            font-size: 16px;
            color: #666;
            line-height: 1.6;
            padding: 20px 0;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
        }
        
        .product-details-list {
            list-style: none;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .product-details-list li {
            padding: 12px;
            background-color: #f9f9f9;
            border-radius: 5px;
            border-left: 4px solid #2196F3;
            font-size: 14px;
        }
        
        .product-details-list b {
            color: #333;
            display: block;
            margin-bottom: 5px;
        }
        
        .tags-section {
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        
        .tags-label {
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }
        
        #tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .tag {
            background-color: #e3f2fd;
            color: #1976d2;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid #90caf9;
        }
        
        @media (max-width: 768px) {
            .product-wrapper {
                grid-template-columns: 1fr;
                gap: 30px;
                padding: 20px;
            }
            
            .product-title {
                font-size: 24px;
            }
            
            .product-price {
                font-size: 24px;
            }
            
            .product-details-list {
                grid-template-columns: 1fr;
            }
            
            .main-image-container {
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="header-buttons">
        <button id="backbtn">← Back</button>
    </div>
    
    <div class="product-container">
        <div class="product-wrapper">
            <!-- Image Section -->
            <div class="product-images">
                <div class="main-image-container">
                    <img id="thumbnail" src="" alt="Product Image">
                </div>
                <div class="image-gallery" id="imageGallery">
                    <!-- Additional images will be loaded here -->
                </div>
            </div>
            
            <!-- Product Info Section -->
            <div class="product-info">
                <h1 id="title" class="product-title"></h1>
                
                <div class="product-meta">
                    <div class="rating">
                        <span class="rating-value" id="rating">★ 0</span>
                        <span>/ 5</span>
                    </div>
                    <div class="stock-status" id="availability"></div>
                </div>
                
                <div class="product-price" id="price"></div>
                
                <p id="description" class="product-description"></p>
                
                <div>
                    <h3 style="margin-bottom: 15px; color: #333;">Product Details</h3>
                    <ul id="product-details" class="product-details-list">
                        <!-- Details will be loaded here -->
                    </ul>
                </div>
                
                <div class="tags-section">
                    <div class="tags-label">Tags:</div>
                    <div id="tags"></div>
                </div>
            </div>
        </div>
    </div>
    
</body>
</html>
