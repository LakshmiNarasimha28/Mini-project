<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Bar</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            /* background-color: oldlace; */
        }
        .header-buttons {
            margin-bottom: 20px;
        }
        #backbtn {
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 5px;
            background-color: #2196F3;
            color: white;
            border: none;
            margin-right: 10px;
        }
        #backbtn:hover {
            background-color: #0b7dda;
            transform: translateY(-2px);
        }
        #results {
            margin-top: 20px;
        }

        /* #searchinput {
            padding: 8px;
            width: 200px;
            margin: 10px;

        }
        #searchbtn {
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 5px;
        } */
        #searchinput {
            padding: 12px 16px;
            width: 250px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            margin: 0 10px 0 0;
        }

        #searchinput:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        #searchbtn {
            padding: 12px 24px;
            background-color: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        #searchbtn:hover {
            transform: translateY(-3px);
        }
    </style>
</head>
<body>
    <h4 id="heading"></h4>
    <div class="header-buttons">
        <button id="backbtn">← Back</button>
    </div>
    <input type="text" id="searchinput" placeholder="Search products..." />
    <button id="searchbtn">Search</button>
    <div id="results"></div>
</body>
<script src="search.js" defer></script>
</html>
